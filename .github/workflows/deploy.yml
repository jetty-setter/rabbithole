name: Deploy

# Ship application artifacts on every push to main. Assumes a least-privilege
# AWS role via GitHub OIDC — no long-lived keys. (Infrastructure is applied
# manually with `terraform apply`; state is local.)
on:
  push:
    branches: [main]
    paths:
      - "api/**"
      - "worker/**"
      - "frontend/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: false

permissions:
  id-token: write # mint the OIDC token
  contents: read

env:
  AWS_REGION: us-east-1
  ROLE_ARN: arn:aws:iam::936922781601:role/rabbithole-dev-deploy
  API_REPO: 936922781601.dkr.ecr.us-east-1.amazonaws.com/rabbithole-dev-api
  WORKER_REPO: 936922781601.dkr.ecr.us-east-1.amazonaws.com/rabbithole-dev-worker
  API_FUNCTION: rabbithole-dev-api
  ECS_CLUSTER: rabbithole-dev
  ECS_SERVICE: rabbithole-dev-worker
  FRONTEND_BUCKET: rabbithole-dev-frontend-936922781601
  DISTRIBUTION_ID: E44SKFZVQZ8BJ
  VITE_API_URL: https://wwvgn3hxjl.execute-api.us-east-1.amazonaws.com
  VITE_WS_URL: wss://vi8lma5n8g.execute-api.us-east-1.amazonaws.com/prod

jobs:
  deploy:
    name: Build + deploy
    # Native ARM64 runner (free for public repos) — builds the Graviton images
    # without QEMU emulation, which matters now the API bakes an ONNX model.
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v3

      # API — container Lambda. --provenance=false: Lambda rejects OCI manifest lists.
      - name: Build + push API image
        run: |
          docker buildx build --platform linux/arm64 --provenance=false --sbom=false \
            -t "$API_REPO:latest" --push api

      - name: Roll out API Lambda
        run: |
          aws lambda update-function-code --function-name "$API_FUNCTION" \
            --image-uri "$API_REPO:latest" >/dev/null
          aws lambda wait function-updated --function-name "$API_FUNCTION"

      # Worker — Fargate task. New tasks pull :latest on next scale-up; force a
      # deployment so a currently-running task is replaced too.
      - name: Build + push worker image
        run: |
          docker buildx build --platform linux/arm64 --provenance=false --sbom=false \
            -t "$WORKER_REPO:latest" --push worker

      - name: Redeploy worker service
        run: |
          aws ecs update-service --cluster "$ECS_CLUSTER" --service "$ECS_SERVICE" \
            --force-new-deployment >/dev/null

      # Frontend — static build to S3 + CDN invalidation.
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Build + publish frontend
        run: |
          cd frontend
          npm ci
          npm run build
          aws s3 sync dist/ "s3://$FRONTEND_BUCKET/" --delete
          aws cloudfront create-invalidation \
            --distribution-id "$DISTRIBUTION_ID" --paths "/*" >/dev/null
