name: Deploy

# Ship application artifacts on every push to main. Assumes a least-privilege
# AWS role via GitHub OIDC — no long-lived keys. Infrastructure changes are
# managed separately by terraform.yml against remote S3 state with a gated apply.
on:
  push:
    branches: [main]
    paths:
      - "api/**"
      - "worker/**"
      - "frontend/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: false

permissions:
  id-token: write # mint the OIDC token
  contents: read

env:
  AWS_REGION: us-east-1
  ROLE_ARN: arn:aws:iam::936922781601:role/rabbithole-dev-deploy
  API_REPO: 936922781601.dkr.ecr.us-east-1.amazonaws.com/rabbithole-dev-api
  WORKER_REPO: 936922781601.dkr.ecr.us-east-1.amazonaws.com/rabbithole-dev-worker
  API_FUNCTION: rabbithole-dev-api
  ECS_CLUSTER: rabbithole-dev
  ECS_SERVICE: rabbithole-dev-worker
  FRONTEND_BUCKET: rabbithole-dev-frontend-936922781601
  DISTRIBUTION_ID: E44SKFZVQZ8BJ
  VITE_API_URL: https://wwvgn3hxjl.execute-api.us-east-1.amazonaws.com
  VITE_WS_URL: wss://vi8lma5n8g.execute-api.us-east-1.amazonaws.com/prod

jobs:
  deploy:
    name: Build + deploy
    # Native ARM64 runner (free for public repos) — builds the Graviton images
    # without QEMU emulation, which matters now the API bakes an ONNX model.
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v3

      # API — container Lambda. --provenance=false: Lambda rejects OCI manifest lists.
      - name: Build + push API image
        run: |
          docker buildx build --platform linux/arm64 --provenance=false --sbom=false \
            -t "$API_REPO:latest" --push api

      - name: Roll out API Lambda
        run: |
          aws lambda update-function-code --function-name "$API_FUNCTION" \
            --image-uri "$API_REPO:latest" >/dev/null
          aws lambda wait function-updated --function-name "$API_FUNCTION"

      # Worker — Fargate task. New tasks pull :latest on next scale-up; force a
      # deployment so a currently-running task is replaced too.
      - name: Build + push worker image
        run: |
          docker buildx build --platform linux/arm64 --provenance=false --sbom=false \
            -t "$WORKER_REPO:latest" --push worker

      - name: Redeploy worker service
        run: |
          aws ecs update-service --cluster "$ECS_CLUSTER" --service "$ECS_SERVICE" \
            --force-new-deployment >/dev/null

      # Frontend — static build to S3 + CDN invalidation.
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Build + publish frontend
        run: |
          cd frontend
          npm ci
          npm run build
          # index.html is the one file whose CONTENT changes on every deploy
          # while its URL never does. The CloudFront distribution's
          # Managed-CachingOptimized policy applies its own 24h default TTL
          # to any object the origin doesn't send an explicit Cache-Control
          # for, and neither S3 nor this sync ever set one -- so index.html
          # (and the browser's own cache of it, entirely outside
          # CloudFront's invalidation) could serve a stale page for up to a
          # day after a deploy despite the invalidation below succeeding.
          # Only dist/assets/*.js|css are content-hashed by Vite (safe to
          # cache forever, a new build gets a new filename); the images/
          # logos/favicons at the dist root come from public/ unhashed and
          # have been updated in place under the same filename before, so
          # they're deliberately left on the origin's default (unset)
          # cache-control rather than also marked immutable. Only
          # index.html needs the explicit no-cache override here.
          aws s3 sync dist/ "s3://$FRONTEND_BUCKET/" --delete \
            --exclude "index.html"
          aws s3 cp dist/index.html "s3://$FRONTEND_BUCKET/index.html" \
            --cache-control "no-cache, no-store, must-revalidate, max-age=0" \
            --content-type "text/html"
          aws cloudfront create-invalidation \
            --distribution-id "$DISTRIBUTION_ID" --paths "/*" >/dev/null

      # Prove the public hostname is actually serving THIS build, rather
      # than trusting that a successful sync + invalidation implies it.
      # Polls (invalidation propagation isn't instant) until the live
      # index.html references this run's exact CSS filename AND that CSS
      # file, fetched live, contains this build's content -- not inferred
      # from local dist/, git, or CI exit codes.
      - name: Verify live deployment
        run: |
          cd frontend
          PROD_URL="https://rabbithole.stephsimmons.dev"
          for i in $(seq 1 24); do
            curl -fsS --max-time 10 "$PROD_URL/?v=$(date +%s%N)" -o /tmp/live-index.html || true
            VERIFIED=true
            for LOCAL_FILE in dist/assets/index-*.css dist/assets/index-*.js; do
              ASSET="/assets/$(basename "$LOCAL_FILE")"
              if ! grep -Fq "$ASSET" /tmp/live-index.html || ! curl -fsS --max-time 20 "$PROD_URL$ASSET" -o /tmp/live-asset || ! cmp -s "$LOCAL_FILE" /tmp/live-asset; then
                VERIFIED=false
                echo "Attempt $i: waiting for $ASSET"
                break
              fi
            done
            if [ "$VERIFIED" = true ]; then
              echo "VERIFIED: live JavaScript and CSS match this build exactly."
              exit 0
            fi
            sleep 10
          done
          echo "FAILED: live assets did not converge to this build."
          exit 1
