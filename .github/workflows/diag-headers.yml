name: Diagnostic - live headers
on:
  workflow_dispatch:

jobs:
  headers:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Dump full response headers from the live production hostname
        run: |
          echo "=== HEAD request to https://rabbithole.stephsimmons.dev/ ==="
          curl -sS -D - -o /dev/null "https://rabbithole.stephsimmons.dev/?v=$(date +%s%N)"
          echo ""
          echo "=== DNS resolution ==="
          getent hosts rabbithole.stephsimmons.dev || true
          echo ""
          echo "=== verbose connect (TLS cert CN/SAN, redirect chain) ==="
          curl -sS -v -o /dev/null "https://rabbithole.stephsimmons.dev/?v=$(date +%s%N)" 2>&1 | grep -Ei "^\* (Connected to|SSL connection|subject:|start date|expire date|issuer:)|^< " || true
