name: Terraform

# Infra through CI against remote (S3) state with native locking.
#   • push to main touching infra/  → automatic `plan` (visibility, no changes made)
#   • manual dispatch                → `plan` or `apply` (the deliberate apply gate)
# Auto-applying infrastructure on every merge is intentionally avoided — the blast
# radius is too large. PR-time fmt/validate is handled by the CI workflow.
on:
  push:
    branches: [main]
    paths:
      - "infra/**"
      - ".github/workflows/terraform.yml"
  workflow_dispatch:
    inputs:
      action:
        description: "Operation to run"
        type: choice
        options: [plan, apply]
        default: plan

concurrency:
  group: terraform-state
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  TF_ROLE_ARN: arn:aws:iam::936922781601:role/rabbithole-dev-terraform

jobs:
  terraform:
    name: ${{ github.event_name == 'workflow_dispatch' && inputs.action || 'plan' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.TF_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: hashicorp/setup-terraform@v3
      - run: terraform init
      - run: terraform plan -no-color
      - name: Apply
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'apply'
        run: terraform apply -auto-approve -no-color
